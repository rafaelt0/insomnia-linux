name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, lint, and release build
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 does not package gtk4-layer-shell; Arch does, with a current Rust.
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install native dependencies
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 gtk4-layer-shell dbus jq shellcheck desktop-file-utils
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain and library versions
        run: |
          rustc --version
          cargo --version
          pkg-config --modversion gtk4 gtk4-layer-shell-0
      - name: Test and lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          bash -n install.sh uninstall.sh tests/e2e.sh tests/prompt.sh tests/uninstall.sh
          shellcheck install.sh uninstall.sh tests/e2e.sh tests/prompt.sh tests/uninstall.sh
          desktop-file-validate packaging/insomnia.desktop
          tests/uninstall.sh
      - name: Build release
        run: cargo build --release --locked
