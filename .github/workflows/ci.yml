name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test, lint, and release build
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 does not package gtk4-layer-shell; Arch does, with a current Rust.
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install native dependencies
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 gtk4-layer-shell dbus shellcheck desktop-file-utils
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain and library versions
        run: |
          rustc --version
          cargo --version
          pkg-config --modversion gtk4 gtk4-layer-shell-0
      - name: Test and lint
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          bash -n install.sh uninstall.sh tests/e2e.sh tests/prompt.sh
          shellcheck install.sh uninstall.sh tests/e2e.sh tests/prompt.sh
          desktop-file-validate packaging/insomnia.desktop
      - name: Build release
        run: cargo build --release --locked

  without-layer-shell:
    name: Build and test without gtk4-layer-shell (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config dbus
      - name: Test and lint
        run: |
          cargo test --locked --no-default-features
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Check the binary does not need gtk4-layer-shell
        run: |
          cargo build --release --locked --no-default-features
          ! ldd target/release/insomnia | grep -q layer-shell
