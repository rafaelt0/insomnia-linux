name: Release

# Builds the download on Ubuntu 24.04, so its glibc and GTK baseline also runs
# on newer distributions. A pull request only uploads it as an artifact; a
# v* tag publishes it as a GitHub release.

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - install.sh
      - uninstall.sh
      - Cargo.toml
      - Cargo.lock
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build the download
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwayland-dev wayland-protocols meson ninja-build pkg-config
      - name: Build gtk4-layer-shell, which Ubuntu 24.04 does not package
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr/local -Dintrospection=false -Dvapi=false -Ddocs=false -Dexamples=false -Dtests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig
      - name: Package
        run: |
          version=${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || version=0.0.0-pr${{ github.event.number }}
          packaging/release.sh "$version" dist
      - name: Check the plain binary runs without gtk4-layer-shell
        run: |
          ! ldd dist/insomnia-*/bin/insomnia-plain | grep -q layer-shell
          ldd dist/insomnia-*/bin/insomnia | grep -q libgtk4-layer-shell.so.0
          dist/insomnia-*/bin/insomnia-plain --help
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: download
          path: dist/*.tar.xz*

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: download
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*.tar.xz*
